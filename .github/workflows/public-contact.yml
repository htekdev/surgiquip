name: Public Contact Regression

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  public-contact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:quality
      - run: npm run build
      - name: Built website and provider-preservation contracts with coverage
        run: npm run test:public-contact
      - name: Preserve scoped coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-contact-coverage
          path: coverage/public-contact.lcov
          retention-days: 7
